      macros:
        - macro: '{$AOS.AUTH.FAILED.MAX}'
          value: '20'
          description: 'The trigger fires when failed authentications on a server grow by more than this between two polls.'
        - macro: '{$AOS.AUTH.OUTSTANDING.MAX}'
          value: '20'
          description: 'The trigger fires when a server keeps more outstanding requests than this for 5 minutes.'
        - macro: '{$AOS.AUTH.TIMEOUTS.MAX}'
          value: '10'
          description: 'The trigger fires when timeouts on a server grow by more than this between two polls.'
        - macro: '{$AOS.CPU.UTIL.MAX.CRIT}'
          value: '90'
          description: 'High threshold for the 5 minute average CPU utilization, in percent.'
        - macro: '{$AOS.CPU.UTIL.MAX.WARN}'
          value: '80'
          description: 'Warning threshold for the 5 minute average CPU utilization, in percent.'
        - macro: '{$AOS.MEMORY.UTIL.MAX}'
          value: '90'
          description: 'Warning threshold for the 5 minute average memory utilization, in percent.'
        - macro: '{$AOS.PLATFORM.PUSED.MAX.CRIT}'
          value: '90'
          description: 'High threshold for AP and user capacity usage, in percent of the platform limit.'
        - macro: '{$AOS.PLATFORM.PUSED.MAX.WARN}'
          value: '80'
          description: 'Warning threshold for AP and user capacity usage, in percent of the platform limit.'
        - macro: '{$AOS.RESTART.GRACE}'
          value: 30m
          description: 'Triggers caused by a controller reboot stay quiet until the controller has been up this long. Keep this value equal to the same macro in Template ArubaOS cluster.'
        - macro: '{$AOS.STORAGE.IMAGE.MATCHES}'
          value: '^/mnt/disk[0-9]+$'
          description: 'Mounts that match this regex hold boot images. Keep it equal to the regex in the boot image context macros.'
        - macro: '{$AOS.STORAGE.PUSED.MAX.CRIT}'
          value: '90'
          description: 'High threshold for storage usage, in percent. Set a context macro to change one mount.'
        - macro: '{$AOS.STORAGE.PUSED.MAX.CRIT:regex:"^/mnt/disk[0-9]+$"}'
          value: '100'
          description: 'Boot image mounts never alert. The image size is fixed.'
        - macro: '{$AOS.STORAGE.PUSED.MAX.WARN}'
          value: '80'
          description: 'Warning threshold for storage usage, in percent. Set a context macro to change one mount.'
        - macro: '{$AOS.STORAGE.PUSED.MAX.WARN:regex:"^/mnt/disk[0-9]+$"}'
          value: '100'
          description: 'Boot image mounts never alert. The image size is fixed.'
