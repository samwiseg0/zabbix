zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: b5f8039c90b944bcaa055e5c0e070ce9
      template: 'Template ArubaOS'
      name: 'Template ArubaOS'
      description: 'This template monitors ArubaOS controllers and conductors over SNMP. Each host must set the host macros {$SNMP_COMMUNITY}, {$WLC_TOTAL_AP} and {$WLC_TOTAL_USER}. {$WLC_TOTAL_AP} is the AP capacity of the platform. {$WLC_TOTAL_USER} is the user capacity of the platform. Template ArubaOS cluster is an optional companion. See the README.'
      groups:
        - name: Templates
      items:
        - uuid: f9ad1194df2b4aeabe9cb2db84fdb03a
          name: 'Base MAC'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.2.1.7.0
          key: aos.baseMAC
          delay: 1d
          history: 90d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: Application
              value: 'System Information'
        - uuid: 7e5ebe6b8ecc438bb2b5bac30ff1c4bc
          name: 'Config ID'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.2.1.23.0
          key: aos.configID
          delay: 5m
          history: 90d
          tags:
            - tag: Application
              value: 'System Health'
        - uuid: 0d4cf4315cc747cbbac73cfc7548029e
          name: 'Hardware Version'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.2.1.27.0
          key: aos.hardwareVer
          delay: 1d
          history: 90d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: Application
              value: 'System Information'
        - uuid: 14646afdf49c48ada2c9e51c5d103fa5
          name: Hostname
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.1.1.1.0
          key: aos.hostName
          delay: 1d
          history: 90d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: Application
              value: 'System Information'
        - uuid: 9141c98ed3764349b01af06c237c0776
          name: 'IP Address'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.1.1.3.0
          key: aos.ip
          delay: 1d
          history: 90d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: Application
              value: 'System Information'
        - uuid: 52d7bc84825a4b66bd21db8e7f723fa9
          name: 'IPv6 Address'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.1.1.13.0
          key: aos.ipv6
          delay: 1d
          history: 90d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: Application
              value: 'System Information'
        - uuid: eace3d888dc84d5b9f3813fee486c484
          name: 'Switch Local License Count'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.1.1.7.0
          key: aos.localLics
          delay: 1d
          history: 90d
          tags:
            - tag: Application
              value: 'System Information'
        - uuid: e789d6eb7b6f4051aacaac3a0d8543ab
          name: 'Memory Free'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.1.1.11.1.4.1
          key: aos.memFree
          delay: 5m
          history: 90d
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1000'
          tags:
            - tag: Application
              value: Memory
        - uuid: f6a5fc0fc57e4dcca4b87011b3c58e4f
          name: 'Memory Total'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.1.1.11.1.2.1
          key: aos.memTotal
          delay: 5m
          history: 90d
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1000'
          tags:
            - tag: Application
              value: Memory
        - uuid: e529da2c2b3d4f7abe27221bc46fcadc
          name: 'Memory Used'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.1.1.11.1.3.1
          key: aos.memUsed
          delay: 5m
          history: 90d
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1000'
          tags:
            - tag: Application
              value: Memory
        - uuid: d00f1f22022543368981b172970cd418
          name: 'Memory Used Percent'
          type: CALCULATED
          key: aos.memUsedPer
          delay: 5m
          history: 90d
          units: '%'
          params: last(//aos.memUsed)/(last(//aos.memTotal)/100)
          tags:
            - tag: Application
              value: Memory
          triggers:
            - uuid: 22f281addf574034acb1443bbeda0d5b
              expression: 'avg(/Template ArubaOS/aos.memUsedPer,5m)>{$AOS.MEMORY.UTIL.MAX}'
              name: 'High Memory Usage on {HOST.NAME}'
              opdata: 'Current: {ITEM.LASTVALUE1}'
              priority: WARNING
        - uuid: 15c8b75b865a426f881462d498912aea
          name: Model
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.1.1.2.0
          key: aos.model
          delay: 1d
          history: 90d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: Application
              value: 'System Information'
        - uuid: 55a5ffb483744bbb8567a99d2efcb973
          name: 'Reboot Reason'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.2.1.25.0
          key: aos.rebootReason
          history: 90d
          value_type: TEXT
          trends: '0'
          tags:
            - tag: Application
              value: 'System Health'
        - uuid: 2faa02c58fdd4113acc4d026af1b4924
          name: 'Software Version'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.2.1.28.0
          key: aos.softwareVer
          delay: 1d
          history: 90d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: Application
              value: 'System Information'
        - uuid: 09bcdffcf969417495ecd39ede0a23a2
          name: 'Switch Role'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.1.1.4.0
          key: aos.switchRole
          delay: 1d
          history: 90d
          valuemap:
            name: 'AOS Switch Roles'
          tags:
            - tag: Application
              value: 'System Information'
        - uuid: ddc2f0b8de5944038c80080bbdd4c423
          name: 'Switch Serial Number'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.1.1.12.0
          key: aos.switchSerial
          delay: 1d
          history: 90d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: Application
              value: 'System Information'
        - uuid: f5c26a521bd44179a61ff7d06eaef0be
          name: 'Platform AP Usage Percentage'
          type: CALCULATED
          key: aos.sysAPUsage
          history: 90d
          units: '%'
          params: 'last(//aos.sysTotalAPs)/({$WLC_TOTAL_AP}/100)'
          tags:
            - tag: Application
              value: 'System Health'
          triggers:
            - uuid: 73d63a6fd91d467abe73f0246efefcae
              expression: 'avg(/Template ArubaOS/aos.sysAPUsage,5m)>{$AOS.PLATFORM.PUSED.MAX.WARN}'
              name: 'Platform AP Capacity Usage is High on {HOST.NAME}'
              opdata: 'Current: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'Platform AP Capacity Usage is Very High on {HOST.NAME}'
                  expression: 'avg(/Template ArubaOS/aos.sysAPUsage,5m)>{$AOS.PLATFORM.PUSED.MAX.CRIT}'
            - uuid: 0d9bfe5313a24a5b94681a17c43516bc
              expression: 'avg(/Template ArubaOS/aos.sysAPUsage,5m)>{$AOS.PLATFORM.PUSED.MAX.CRIT}'
              name: 'Platform AP Capacity Usage is Very High on {HOST.NAME}'
              opdata: 'Current: {ITEM.LASTVALUE1}'
              priority: HIGH
        - uuid: 43cb4e98f9664a68920a0ecf46122c2b
          name: 'System Temperature'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.2.1.10.0
          key: aos.sysTemp
          delay: 5m
          history: 300d
          value_type: CHAR
          trends: '0'
          tags:
            - tag: Application
              value: 'System Health'
          triggers:
            - uuid: 5af0a1879c254052b4c852602b8b33f3
              expression: 'find(/Template ArubaOS/aos.sysTemp,,"like","CRITICAL")'
              name: 'Temperature Alert CRITICAL on {HOST.NAME}'
              priority: DISASTER
            - uuid: ee81a87b32704d21ac8bbac509908c93
              expression: 'find(/Template ArubaOS/aos.sysTemp,,"like","MAJOR")'
              name: 'Temperature Alert MAJOR on {HOST.NAME}'
              priority: HIGH
            - uuid: 9e68b9ea1d5f402595cc39c2fb38e10e
              expression: 'find(/Template ArubaOS/aos.sysTemp,,"like","MINOR")'
              name: 'Temperature Alert MINOR on {HOST.NAME}'
              priority: WARNING
        - uuid: b19306280d064667b006018de67c938e
          name: 'System Temperature - Numeric'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.2.1.10.0
          key: aos.sysTempNum
          delay: 5m
          history: 300d
          value_type: FLOAT
          units: C
          preprocessing:
            - type: REGEX
              parameters:
                - '(\d*\.?\d+)'
                - \1
          tags:
            - tag: Application
              value: 'System Health'
        - uuid: d643df33bf5f433ea6452205148b6bf0
          name: 'Total Number of APs'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.5.2.1.1.0
          key: aos.sysTotalAPs
          history: 90d
          tags:
            - tag: Application
              value: 'System Health'
        - uuid: b3b70cb018d644299bcf477a6720628e
          name: 'Total Number of Associations'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.5.2.1.2.0
          key: aos.sysTotalAssociations
          history: 90d
          tags:
            - tag: Application
              value: 'System Health'
        - uuid: 58a44d32aa064dca89430ad300f9d1e8
          name: 'Total Number of Users'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.14823.2.2.1.14.1.1.0
          key: aos.sysTotalUsers
          history: 90d
          tags:
            - tag: Application
              value: 'System Health'
        - uuid: 8deabcc6d5c7407eadd0ebc38a025ad1
          name: 'System Uptime'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.3.0
          key: aos.sysUptime
          history: 90d
          value_type: FLOAT
          units: s
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: Application
              value: 'System Health'
        - uuid: bf7e48ed1c8c4c77acf567c66707f8a9
          name: 'Platform User Usage Percentage'
          type: CALCULATED
          key: aos.sysUserUsage
          history: 90d
          units: '%'
          params: 'last(//aos.sysTotalUsers)/({$WLC_TOTAL_USER}/100)'
          tags:
            - tag: Application
              value: 'System Health'
          triggers:
            - uuid: 12cf626bec4b436db6ac8c52d5dda51f
              expression: 'avg(/Template ArubaOS/aos.sysUserUsage,5m)>{$AOS.PLATFORM.PUSED.MAX.WARN}'
              name: 'Platform User Capacity Usage is High on {HOST.NAME}'
              opdata: 'Current: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'Platform User Capacity Usage is Very High on {HOST.NAME}'
                  expression: 'avg(/Template ArubaOS/aos.sysUserUsage,5m)>{$AOS.PLATFORM.PUSED.MAX.CRIT}'
            - uuid: 3f0c53d5a62a4ba4946119fe044fca1a
              expression: 'avg(/Template ArubaOS/aos.sysUserUsage,5m)>{$AOS.PLATFORM.PUSED.MAX.CRIT}'
              name: 'Platform User Capacity Usage is Very High on {HOST.NAME}'
              opdata: 'Current: {ITEM.LASTVALUE1}'
              priority: HIGH
        - uuid: 98b59c287c684fa7ab17eb3063e2d245
          name: 'Number of network interfaces'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.2.1.0
          key: ifNumber
          delay: '3600'
          history: 7d
          description: 'The number of network interfaces (regardless of their current state) present on this system.'
          tags:
            - tag: Application
              value: Interfaces
      discovery_rules:
        - uuid: 2b105d6d52e2462c8cf3e591546e851d
          name: 'Access Points'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#APNAME},.1.3.6.1.4.1.14823.2.2.1.5.2.1.4.1.3]'
          key: 'aos.ap.[{#APNAME}]'
          delay: 1h
          lifetime: 1h
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 7a6650e79d404781a4c744f42bd83e0d
              name: 'AP Active/Standby - {#APNAME}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.2.1.5.2.1.4.1.41.{#SNMPINDEX}'
              key: 'aos.apAcStand.[{#APNAME}]'
              delay: 2m
              history: 90d
              valuemap:
                name: 'AOS AP Active'
              tags:
                - tag: Application
                  value: 'Access Points'
            - uuid: 8f2b77ceddc0499ab0547eba9fe91476
              name: 'AP Bootstraps - {#APNAME}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.2.1.5.2.1.4.1.20.{#SNMPINDEX}'
              key: 'aos.apBootstraps.[{#APNAME}]'
              delay: 2m
              history: 90d
              value_type: FLOAT
              tags:
                - tag: Application
                  value: 'Access Points'
            - uuid: 176ebc869cd04feab75d78541d8005e6
              name: 'Backup Switch IP Address - {#APNAME}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.2.1.5.2.1.4.1.40.{#SNMPINDEX}'
              key: 'aos.apBSWIP.[{#APNAME}]'
              delay: 1h
              history: 90d
              value_type: TEXT
              trends: '0'
              tags:
                - tag: Application
                  value: 'Access Points'
            - uuid: 7f94f48bb4bb47d9901eab1bcd980557
              name: 'AP Group - {#APNAME}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.2.1.5.2.1.4.1.4.{#SNMPINDEX}'
              key: 'aos.apGroup.[{#APNAME}]'
              delay: 6h
              history: 90d
              value_type: TEXT
              trends: '0'
              tags:
                - tag: Application
                  value: 'Access Points'
            - uuid: 985dd9abde884ac1860eb918fec5133e
              name: 'IP Address - {#APNAME}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.2.1.5.2.1.4.1.2.{#SNMPINDEX}'
              key: 'aos.apIP.[{#APNAME}]'
              delay: 6h
              history: 90d
              value_type: TEXT
              trends: '0'
              tags:
                - tag: Application
                  value: 'Access Points'
            - uuid: c22ae2f3b7b541be80a27ae5e3b671e9
              name: 'AP Reboots - {#APNAME}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.2.1.5.2.1.4.1.21.{#SNMPINDEX}'
              key: 'aos.apReboots.[{#APNAME}]'
              delay: 2m
              history: 90d
              value_type: FLOAT
              tags:
                - tag: Application
                  value: 'Access Points'
            - uuid: 6e41845e48eb4b75ae76fea389ec4320
              name: 'AP Serial - {#APNAME}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.2.1.5.2.1.4.1.6.{#SNMPINDEX}'
              key: 'aos.apSerial.[{#APNAME}]'
              delay: 24h
              history: 90d
              value_type: TEXT
              trends: '0'
              tags:
                - tag: Application
                  value: 'Access Points'
            - uuid: 4d571559de3f49b3bb4d1c89e2dd3ce6
              name: 'AP Status - {#APNAME}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.2.1.5.2.1.4.1.19.{#SNMPINDEX}'
              key: 'aos.apStatus.[{#APNAME}]'
              delay: 2m
              history: 90d
              valuemap:
                name: 'AOS AP Status'
              tags:
                - tag: Application
                  value: 'Access Points'
            - uuid: dcbda287678149ad864ed986b68f64be
              name: 'Switch IP Address - {#APNAME}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.2.1.5.2.1.4.1.39.{#SNMPINDEX}'
              key: 'aos.apSWIP.[{#APNAME}]'
              delay: 1h
              history: 10d
              value_type: TEXT
              trends: '0'
              tags:
                - tag: Application
                  value: 'Access Points'
            - uuid: 96ae7eb1b6dc4824b0bf2404655aa9f6
              name: 'AP Type - {#APNAME}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.2.1.5.2.1.4.1.13.{#SNMPINDEX}'
              key: 'aos.apType.[{#APNAME}]'
              delay: 24h
              history: 90d
              value_type: TEXT
              trends: '0'
              tags:
                - tag: Application
                  value: 'Access Points'
            - uuid: c89435e1372147deb8f7a49e52b5bada
              name: 'AP Uptime - {#APNAME}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.2.1.5.2.1.4.1.12.{#SNMPINDEX}'
              key: 'aos.apUptime.[{#APNAME}]'
              delay: 2m
              history: 90d
              value_type: FLOAT
              units: uptime
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.01'
              tags:
                - tag: Application
                  value: 'Access Points'
          trigger_prototypes:
            - uuid: e201bb198db64b659e4ed78a82724611
              expression: '(last(/Template ArubaOS/aos.apBootstraps.[{#APNAME}],#1)<>last(/Template ArubaOS/aos.apBootstraps.[{#APNAME}],#2))=1 and last(/Template ArubaOS/aos.apAcStand.[{#APNAME}],#3)=1 and last(/Template ArubaOS/aos.apBootstraps.[{#APNAME}])<>0 and last(/Template ArubaOS/aos.apStatus.[{#APNAME}],#3)<>2 and count(/Template ArubaOS/aos.apStatus.[{#APNAME}],10m,"eq","2")=0 and last(/Template ArubaOS/aos.apUptime.[{#APNAME}])>=200 and last(/Template ArubaOS/aos.sysUptime)>30m and nodata(/Template ArubaOS/aos.sysUptime,3m)=0'
              name: '{#APNAME} Bootstrap number has changed'
              priority: WARNING
              dependencies:
                - name: '{#APNAME} is DOWN'
                  expression: 'change(/Template ArubaOS/aos.apStatus.[{#APNAME}])>.5 and last(/Template ArubaOS/aos.apAcStand.[{#APNAME}],#3)=0 and nodata(/Template ArubaOS/aos.apIP.[{#APNAME}],120s)=1'
                  recovery_expression: 'last(/Template ArubaOS/aos.apStatus.[{#APNAME}])=1'
                - name: '{#APNAME} Uptime has changed'
                  expression: 'last(/Template ArubaOS/aos.apUptime.[{#APNAME}])>0 and last(/Template ArubaOS/aos.apUptime.[{#APNAME}])<200 and count(/Template ArubaOS/aos.apStatus.[{#APNAME}],10m,"eq","2")=0 and nodata(/Template ArubaOS/aos.apStatus.[{#APNAME}],240s)=0 and last(/Template ArubaOS/aos.apAcStand.[{#APNAME}],#3)=1 and last(/Template ArubaOS/aos.apStatus.[{#APNAME}])<>2 and last(/Template ArubaOS/aos.sysUptime)>30m and nodata(/Template ArubaOS/aos.sysUptime,3m)=0'
            - uuid: 2b7209bbcd0d467ea658b39af97d86a7
              expression: 'change(/Template ArubaOS/aos.apStatus.[{#APNAME}])>.5 and last(/Template ArubaOS/aos.apAcStand.[{#APNAME}],#3)=0 and nodata(/Template ArubaOS/aos.apIP.[{#APNAME}],120s)=1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Template ArubaOS/aos.apStatus.[{#APNAME}])=1'
              name: '{#APNAME} is DOWN'
              priority: HIGH
              manual_close: 'YES'
            - uuid: 60156415aa934790a5019e40dacbef3b
              expression: 'last(/Template ArubaOS/aos.apUptime.[{#APNAME}])>0 and last(/Template ArubaOS/aos.apUptime.[{#APNAME}])<200 and count(/Template ArubaOS/aos.apStatus.[{#APNAME}],10m,"eq","2")=0 and nodata(/Template ArubaOS/aos.apStatus.[{#APNAME}],240s)=0 and last(/Template ArubaOS/aos.apAcStand.[{#APNAME}],#3)=1 and last(/Template ArubaOS/aos.apStatus.[{#APNAME}])<>2 and last(/Template ArubaOS/aos.sysUptime)>30m and nodata(/Template ArubaOS/aos.sysUptime,3m)=0'
              name: '{#APNAME} Uptime has changed'
              priority: WARNING
              manual_close: 'YES'
              dependencies:
                - name: '{#APNAME} is DOWN'
                  expression: 'change(/Template ArubaOS/aos.apStatus.[{#APNAME}])>.5 and last(/Template ArubaOS/aos.apAcStand.[{#APNAME}],#3)=0 and nodata(/Template ArubaOS/aos.apIP.[{#APNAME}],120s)=1'
                  recovery_expression: 'last(/Template ArubaOS/aos.apStatus.[{#APNAME}])=1'
        - uuid: 165d31714e564e53855f921171cb76fa
          name: 'Auth Servers'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},.1.3.6.1.4.1.14823.2.2.1.8.1.1.1.3]'
          key: 'aos.authServer.[{#SNMPVALUE}]'
          delay: 1h
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: f03c2349fdb24b599f5b69f16fdd06d2
              name: 'Server Failed Auths {#SNMPVALUE}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.2.1.8.1.1.1.11.{#SNMPINDEX}'
