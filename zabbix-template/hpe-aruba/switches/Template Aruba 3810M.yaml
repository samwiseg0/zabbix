zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: 0e128fab3d44489bbb588f7ccdeee160
      template: 'Template Aruba 3810M'
      name: 'Template Aruba 3810M'
      groups:
        - name: Templates
      items:
        - uuid: da8bef1bbd834c31bb3362d7bf9ddfbc
          name: 'Base MAC'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.11.2.14.11.5.1.1.6.0]'
          key: hpe.baseMac
          delay: 5m
          history: 1w
          value_type: CHAR
          trends: '0'
          inventory_link: MACADDRESS_A
          tags:
            - tag: Application
              value: System
        - uuid: 9341783194f346ff864f4cdb75a70a7d
          name: 'SNMP walk: entity table (1h)'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.47.1.1.1.1.2,1.3.6.1.2.1.47.1.1.1.1.5,1.3.6.1.2.1.47.1.1.1.1.13,1.3.6.1.2.1.47.1.1.1.1.11,1.3.6.1.2.1.47.1.1.1.1.10,1.3.6.1.2.1.47.1.1.1.1.7,1.3.6.1.2.1.47.1.1.1.1.9]'
          key: 'hpe.inv.walk[1h]'
          delay: 1h
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Raw SNMP walk of the entity table for the three LLD rules, Switch Model and Switch Rom Version. It stores no history.'
          tags:
            - tag: Application
              value: 'SNMP walk'
        - uuid: 42714c9f8b0146b6b059d64e97a2a95d
          name: 'Memory Free'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.11.2.14.11.5.1.1.2.1.1.1.6.1]'
          key: hpe.memFree
          history: 1w
          trends: 100d
          units: bytes
          tags:
            - tag: Application
              value: Memory
          triggers:
            - uuid: fba3f7f9ea494cd7a9b1311eea256925
              expression: 'last(/Template Aruba 3810M/hpe.memFree)<60M'
              name: 'High Memory Usage on {HOST.NAME}'
              priority: HIGH
        - uuid: 87c1b06acb6a4e309d57b6e90c8bf8e0
          name: 'Memory Total'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.11.2.14.11.5.1.1.2.2.1.1.5.1]'
          key: hpe.memTotal
          history: 1w
          trends: 100d
          units: bytes
          tags:
            - tag: Application
              value: Memory
        - uuid: 376ad48b7e0b4feaab384f89c6ca16a9
          name: 'Memory Used'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.11.2.14.11.5.1.1.2.1.1.1.7.1]'
          key: hpe.memUsed
          history: 1w
          trends: 100d
          units: bytes
          tags:
            - tag: Application
              value: Memory
        - uuid: 05227a0d8e7d426182dfb8e602661f5b
          name: 'Switch Rom Version'
          type: DEPENDENT
          key: hpe.romVersion
          delay: '0'
          history: 1w
          value_type: CHAR
          trends: '0'
          description: 'entPhysicalFirmwareRev of the lowest chassis row. That row is 1001 on a single switch and 101001, member 1, on a stack.'
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#CLASS}'
                - 1.3.6.1.2.1.47.1.1.1.1.5
                - '0'
                - '{#VALUE}'
                - 1.3.6.1.2.1.47.1.1.1.1.9
                - '0'
            - type: JAVASCRIPT
              parameters:
                - |
                  var rows = JSON.parse(value).filter(function (r) { return r['{#CLASS}'] === '3'; });
                  if (!rows.length) throw 'No chassis row in the entity table';
                  rows.sort(function (a, b) { return a['{#SNMPINDEX}'] - b['{#SNMPINDEX}']; });
                  return rows[0]['{#VALUE}'];
          master_item:
            key: 'hpe.inv.walk[1h]'
          tags:
            - tag: Application
              value: System
        - uuid: 22cbd9687ba0455093deea690c8e1a60
          name: 'SNMP walk: sensor tables (30s)'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.99.1.1.1.4,1.3.6.1.2.1.99.1.1.1.5,1.3.6.1.4.1.11.2.14.11.1.2.8.1.1.6]'
          key: 'hpe.sensor.walk[30s]'
          delay: 30s
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Raw SNMP walk of entPhySensorValue, entPhySensorOperStatus and hpSystemAirOverTemp for the fan and temperature prototypes. It stores no history.'
          tags:
            - tag: Application
              value: 'SNMP walk'
        - uuid: 4633d1f3e98d4c28851fa605975cba00
          name: 'Serial Number'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.11.2.36.1.1.2.9.0]'
          key: hpe.serialNumber
          delay: 5m
          history: 1w
          value_type: CHAR
          trends: '0'
          inventory_link: SERIALNO_A
          tags:
            - tag: Application
              value: System
        - uuid: 7369dfc31ed1421f94a7f08316c7f1f3
          name: 'CPU Utilization'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.11.2.14.11.5.1.9.6.1.0]'
          key: hpe.switchCpuStat
          history: 1w
          units: '%'
          tags:
            - tag: Application
              value: CPU
          triggers:
            - uuid: 64dff0509f50455398b8df6d918937f2
              expression: 'last(/Template Aruba 3810M/hpe.switchCpuStat,#1:now-60s)>90'
              name: 'High CPU on {HOST.NAME}'
              priority: HIGH
        - uuid: 0c7c5b890c8e4630a575d10b547ecc71
          name: 'Switch Model'
          type: DEPENDENT
          key: hpe.switchModel
          delay: '0'
          history: 1w
          value_type: CHAR
          trends: '0'
          description: 'entPhysicalDescr of the lowest chassis row. That row is 1001 on a single switch and 101001, member 1, on a stack.'
          inventory_link: HARDWARE
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#CLASS}'
                - 1.3.6.1.2.1.47.1.1.1.1.5
                - '0'
                - '{#VALUE}'
                - 1.3.6.1.2.1.47.1.1.1.1.2
                - '0'
            - type: JAVASCRIPT
              parameters:
                - |
                  var rows = JSON.parse(value).filter(function (r) { return r['{#CLASS}'] === '3'; });
                  if (!rows.length) throw 'No chassis row in the entity table';
                  rows.sort(function (a, b) { return a['{#SNMPINDEX}'] - b['{#SNMPINDEX}']; });
                  return rows[0]['{#VALUE}'];
          master_item:
            key: 'hpe.inv.walk[1h]'
          tags:
            - tag: Application
              value: System
        - uuid: 06cd97ba8bb440c3b8ad666217b961b2
          name: 'Switch OS Version'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.11.2.14.11.5.1.1.3.0]'
          key: hpe.switchOSVersion
          delay: 5m
          history: 1w
          value_type: CHAR
          trends: '0'
          inventory_link: SOFTWARE
          tags:
            - tag: Application
              value: System
        - uuid: c0979688c4244013a585cb695733ef77
          name: SysContact
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.4.0]'
          key: hpe.sysContact
          delay: 5m
          history: 1w
          value_type: TEXT
          trends: '0'
          inventory_link: CONTACT
          tags:
            - tag: Application
              value: System
        - uuid: 0ca552d6c4174b7ca38e0d86d61d2e15
          name: SysLocation
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.6.0]'
          key: hpe.sysLocation
          delay: 5m
          history: 1w
          value_type: TEXT
          trends: '0'
          inventory_link: LOCATION
          tags:
            - tag: Application
              value: System
        - uuid: 18ea08499b4d45d28a0f0e40642877df
          name: SysName
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.5.0]'
          key: hpe.sysName
          delay: 5m
          history: 1w
          value_type: TEXT
          trends: '0'
          inventory_link: NAME
          tags:
            - tag: Application
              value: System
        - uuid: d5dd4ea18a2b42799ce973cb092c8635
          name: SysUptime
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: hpe.sysUptime
          history: 1w
          value_type: FLOAT
          trends: 60d
          units: uptime
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: Application
              value: System
          triggers:
            - uuid: 585a1592fec240b3b30c1e8afb14260f
              expression: 'last(/Template Aruba 3810M/hpe.sysUptime)<1000'
              name: '{HOST.NAME} Has been restarted'
              priority: INFO
      discovery_rules:
        - uuid: 3c892519d6824ce08ed133e3d89a7c6a
          name: 'Fan discovery'
          type: DEPENDENT
          key: hpe.fan.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#ENT_CLASS}'
                value: ^7$
                formulaid: A
              - macro: '{#ENT_NAME}'
                value: '{$HPE.FAN.NAME.MATCHES}'
                formulaid: B
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Chassis fans from the entity table. The default {$HPE.FAN.NAME.MATCHES} leaves out Fan 4 and Fan 5, the power supply fans. A stack numbers each row member x 100000 + local index. A single switch has no member part, so {#MEMBER_PREFIX} is empty there.'
          item_prototypes:
            - uuid: 50ce4c5649cf450096015b3640040a68
              name: '{#MEMBER_PREFIX}{#ENT_NAME} Status'
              type: DEPENDENT
              key: 'hpe.fan.status[{#SNMPINDEX}]'
              delay: '0'
              history: 1w
              trends: 100d
              description: 'entPhySensorOperStatus. 1 is ok. A row missing from the walk reads 0, shown as missing.'
              valuemap:
                name: 'Aruba 3810M EntitySensorStatus'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.99.1.1.1.5.{#SNMPINDEX}'
                    - '0'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'hpe.sensor.walk[30s]'
              tags:
                - tag: Application
                  value: System
              trigger_prototypes:
                - uuid: 192c13140a424677b36de279c2d89593
                  expression: 'min(/Template Aruba 3810M/hpe.fan.status[{#SNMPINDEX}],#2)>1 or count(/Template Aruba 3810M/hpe.fan.status[{#SNMPINDEX}],#20,"eq","0")=20'
                  name: '{#MEMBER_PREFIX}{#ENT_NAME} Status on {HOST.NAME}'
                  priority: HIGH
                  description: 'Status 2 or 3 on two polls in a row opens the problem. A missing row reads 0 and opens the problem after 20 polls in a row, about 10 minutes. A member reboot should stay quiet, but no reboot has been watched yet.'
          master_item:
            key: 'hpe.inv.walk[1h]'
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#ENT_CLASS}'
                - 1.3.6.1.2.1.47.1.1.1.1.5
                - '0'
                - '{#ENT_NAME}'
                - 1.3.6.1.2.1.47.1.1.1.1.7
                - '0'
            - type: JAVASCRIPT
              parameters:
                - |
                  var rows = JSON.parse(value);
                  rows.forEach(function (r) {
                      var member = Math.floor(parseInt(r['{#SNMPINDEX}'], 10) / 100000);
                      r['{#MEMBER_PREFIX}'] = member > 0 ? 'Member ' + member + ' ' : '';
                      r['{#AIR_ROW}'] = String(Math.max(member - 1, 0));
                  });
                  return JSON.stringify(rows);
        - uuid: 5b3793514c1444a18dd2aa20fc1b364d
          name: 'Switch Inventory'
          type: DEPENDENT
          key: hpe.inv
          delay: '0'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: a7101ce618e3410b876a529bfe68be18
              name: 'Oper State - {#SNMPVALUE}'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.131.1.1.1.3.{#SNMPINDEX}]'
              key: 'invEntityOperState[{#SNMPVALUE}.{#SNMPINDEX}]'
              delay: 1h
              history: 90d
              tags:
                - tag: Application
                  value: Inventory
            - uuid: 995b655dca1d466fbc82a2f18abf663d
              name: 'Type - {#SNMPVALUE}'
              type: DEPENDENT
              key: 'invEntPhysicalClass[{#SNMPVALUE}.{#SNMPINDEX}]'
              delay: '0'
              history: 90d
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.47.1.1.1.1.5.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: 'hpe.inv.walk[1h]'
              tags:
                - tag: Application
                  value: Inventory
            - uuid: d28f0b87ee544f308d8bc87912b8e8d4
              name: 'Model - {#SNMPVALUE}'
              type: DEPENDENT
              key: 'invPhysicalModelName[{#SNMPVALUE}.{#SNMPINDEX}]'
              delay: '0'
              history: 90d
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.47.1.1.1.1.13.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: 'hpe.inv.walk[1h]'
              tags:
                - tag: Application
                  value: Inventory
            - uuid: c3d9846befcb4785a1bcaca90de37f71
              name: 'Serial Num - {#SNMPVALUE}'
              type: DEPENDENT
              key: 'invPhysicalSerialNum[{#SNMPVALUE}.{#SNMPINDEX}]'
              delay: '0'
              history: 90d
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.47.1.1.1.1.11.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: 'hpe.inv.walk[1h]'
              tags:
                - tag: Application
                  value: Inventory
            - uuid: a96d1d4d2ea2429fb7ce696e45ef71d0
              name: 'Software Rev - {#SNMPVALUE}'
              type: DEPENDENT
              key: 'invPhysicalSoftwareRev[{#SNMPVALUE}.{#SNMPINDEX}]'
              delay: '0'
              history: 90d
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.47.1.1.1.1.10.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: 'hpe.inv.walk[1h]'
              tags:
                - tag: Application
                  value: Inventory
          master_item:
            key: 'hpe.inv.walk[1h]'
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#SNMPVALUE}'
                - 1.3.6.1.2.1.47.1.1.1.1.2
                - '0'
        - uuid: a6dfb255940c4823a71c6f2e6dc6636a
          name: 'Temperature discovery'
          type: DEPENDENT
          key: hpe.temp.discovery
          delay: '0'
          filter:
            conditions:
              - macro: '{#ENT_CLASS}'
                value: ^8$
                formulaid: A
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Temperature sensors from the entity table, one per switch or stack member. {#AIR_ROW} is the member''s row in hpSystemAirTempTable, which starts at 0. A stack can report entity index 0 for its row 1, so the template cannot use that column.'
          item_prototypes:
            - uuid: d36af422e18640298a87d2b770af9531
              name: '{#MEMBER_PREFIX}Over Temperature Status'
              type: DEPENDENT
              key: 'hpe.temp.overtemp[{#SNMPINDEX}]'
              delay: '0'
              history: 1w
              trends: 100d
              description: 'hpSystemAirOverTemp. 1 (true) means the air temperature is over the switch threshold, 45 C by default.'
              valuemap:
                name: 'Aruba 3810M TruthValue'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.11.2.14.11.1.2.8.1.1.6.{#AIR_ROW}'
                    - '0'
              master_item:
                key: 'hpe.sensor.walk[30s]'
              tags:
                - tag: Application
                  value: System
              trigger_prototypes:
                - uuid: e3a0f1df917e448ab6a8bcfea5b67aae
                  expression: 'max(/Template Aruba 3810M/hpe.temp.overtemp[{#SNMPINDEX}],#2)=1'
                  name: '{#MEMBER_PREFIX}Over Temperature on {HOST.NAME}'
                  priority: DISASTER
            - uuid: d65473bd67c3482f947c3408252cac65
              name: '{#MEMBER_PREFIX}{#ENT_NAME} Sensor Status'
              type: DEPENDENT
              key: 'hpe.temp.status[{#SNMPINDEX}]'
              delay: '0'
              history: 1w
              trends: 100d
              description: 'entPhySensorOperStatus. 1 is ok. A row missing from the walk reads 0, shown as missing.'
              valuemap:
                name: 'Aruba 3810M EntitySensorStatus'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.99.1.1.1.5.{#SNMPINDEX}'
                    - '0'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'hpe.sensor.walk[30s]'
              tags:
                - tag: Application
                  value: System
              trigger_prototypes:
                - uuid: 2978f9562dd84645a6478866488b8783
                  expression: 'min(/Template Aruba 3810M/hpe.temp.status[{#SNMPINDEX}],#2)>1 or count(/Template Aruba 3810M/hpe.temp.status[{#SNMPINDEX}],#20,"eq","0")=20'
                  name: '{#MEMBER_PREFIX}{#ENT_NAME} Sensor Status on {HOST.NAME}'
                  priority: AVERAGE
                  description: 'Status 2 or 3 on two polls in a row opens the problem. A missing row reads 0 and opens the problem after 20 polls in a row, about 10 minutes. A member reboot should stay quiet, but no reboot has been watched yet.'
            - uuid: 8cfb652f961446c5805bc51f05d5c745
              name: '{#MEMBER_PREFIX}{#ENT_NAME}'
              type: DEPENDENT
              key: 'hpe.temp.value[{#SNMPINDEX}]'
              delay: '0'
              history: 1w
              units: C
              description: 'entPhySensorValue in degrees C.'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.99.1.1.1.4.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: 'hpe.sensor.walk[30s]'
              tags:
                - tag: Application
                  value: System
              trigger_prototypes:
                - uuid: 9891c67dbe994a14ac741aa789b6ed7b
                  expression: 'last(/Template Aruba 3810M/hpe.temp.value[{#SNMPINDEX}],#1:now-120s)>{$HPE.TEMP.MAX}'
                  name: '{#MEMBER_PREFIX}{#ENT_NAME} too high on {HOST.NAME}'
                  priority: HIGH
          graph_prototypes:
            - uuid: 1e0d82bb7c0449b2be06d28a4cfd77db
              name: '{#MEMBER_PREFIX}{#ENT_NAME}'
              graph_items:
                - drawtype: BOLD_LINE
                  color: C80000
                  calc_fnc: MAX
                  item:
                    host: 'Template Aruba 3810M'
                    key: 'hpe.temp.value[{#SNMPINDEX}]'
          master_item:
            key: 'hpe.inv.walk[1h]'
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#ENT_CLASS}'
                - 1.3.6.1.2.1.47.1.1.1.1.5
                - '0'
                - '{#ENT_NAME}'
                - 1.3.6.1.2.1.47.1.1.1.1.7
                - '0'
            - type: JAVASCRIPT
              parameters:
                - |
                  var rows = JSON.parse(value);
                  rows.forEach(function (r) {
                      var member = Math.floor(parseInt(r['{#SNMPINDEX}'], 10) / 100000);
                      r['{#MEMBER_PREFIX}'] = member > 0 ? 'Member ' + member + ' ' : '';
                      r['{#AIR_ROW}'] = String(Math.max(member - 1, 0));
                  });
                  return JSON.stringify(rows);
      macros:
        - macro: '{$HPE.FAN.NAME.MATCHES}'
          value: '^Fan [1-3]$'
          description: 'Fan names the fan discovery keeps.'
        - macro: '{$HPE.TEMP.MAX}'
          value: '35'
          description: 'Chassis temperature in C above which the temperature trigger fires.'
      valuemaps:
        - uuid: 3bc4c78411244dd481269a1ef9304cf4
          name: 'Aruba 3810M EntityOperState'
          mappings:
            - value: '1'
              newvalue: unknown
            - value: '2'
              newvalue: disabled
            - value: '3'
              newvalue: enabled
            - value: '4'
              newvalue: testing
        - uuid: 2655d85556db48bea688c687c08a0541
          name: 'Aruba 3810M EntitySensorStatus'
          mappings:
            - value: '0'
              newvalue: missing
            - value: '1'
              newvalue: ok
            - value: '2'
              newvalue: unavailable
            - value: '3'
              newvalue: nonoperational
        - uuid: ac5eeb13b3194a4c8a1491ee95c62908
          name: 'Aruba 3810M PhysicalClass'
          mappings:
            - value: '1'
              newvalue: other
            - value: '2'
              newvalue: unknown
            - value: '3'
              newvalue: chassis
            - value: '4'
              newvalue: backplane
            - value: '5'
              newvalue: container
            - value: '6'
              newvalue: powerSupply
            - value: '7'
              newvalue: fan
            - value: '8'
              newvalue: sensor
            - value: '9'
              newvalue: module
            - value: '10'
              newvalue: port
            - value: '11'
              newvalue: stack
        - uuid: 70f4ece78a2b48f9993bb6a058703a44
          name: 'Aruba 3810M TruthValue'
          mappings:
            - value: '1'
              newvalue: 'true'
            - value: '2'
              newvalue: 'false'
  graphs:
    - uuid: 8df552873b06428a91bcd624617b4b31
      name: CPU
      graph_items:
        - color: C80000
          calc_fnc: MAX
          item:
            host: 'Template Aruba 3810M'
            key: hpe.switchCpuStat
